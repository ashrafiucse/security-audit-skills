name: Daily CISA KEV triage

# Stateless by design: reports KEV entries from the last 10 days that are NOT
# already triaged (no matching vuln-db entry, not in an open kev issue).
# Daily cron + dedupe = issues only when something new appears. The workflow
# only ever OPENS ISSUES — it never commits — so it needs only
# `issues: write` and the bot never appears as a repo contributor.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  kev-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find new, untriaged KEV entries
        id: kev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o /tmp/kev.json
          python3 - <<'EOF'
          import datetime, json, os, subprocess
          kev = json.load(open("/tmp/kev.json"))
          cutoff = (datetime.date.today() - datetime.timedelta(days=10)).isoformat()
          recent = [v for v in kev["vulnerabilities"] if (v.get("dateAdded") or "") >= cutoff]

          # already triaged = has a vuln-db entry
          triaged = ""
          entries = "skills/cve-research/vuln-db/entries"
          for name in os.listdir(entries):
              triaged += open(os.path.join(entries, name), encoding="utf-8", errors="replace").read()
          # ... or a recorded decision in the append-only triage log (closed issues
          # live on there — without this, decided CVEs re-appear once their issue closes)
          log = "skills/cve-research/vuln-db/kev-triage-log.md"
          if os.path.exists(log):
              triaged += open(log, encoding="utf-8", errors="replace").read()

          # already reported = mentioned in an open kev-labeled issue
          reported = ""
          try:
              reported = subprocess.run(
                  ["gh", "issue", "list", "--label", "kev", "--state", "open",
                   "--json", "body", "-L", "50"],
                  capture_output=True, text=True, check=True).stdout
          except subprocess.CalledProcessError:
              pass  # worst case: a duplicate issue, never a missed one

          todo = [v for v in recent if v["cveID"] not in triaged and v["cveID"] not in reported]
          lines = [
              f"{v['cveID']} | {v['vendorProject']} {v['product']} | "
              f"added {v.get('dateAdded', '-')} | due {v.get('dueDate', '-')}"
              for v in todo
          ]
          open("/tmp/new.txt", "w").write("\n".join(lines))
          open("/tmp/count.txt", "w").write(str(len(todo)))
          EOF
          echo "new=$(cat /tmp/count.txt)" >> "$GITHUB_OUTPUT"

      - name: Open triage issue for new entries
        if: steps.kev.outputs.new != '' && steps.kev.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COUNT: ${{ steps.kev.outputs.new }}
        run: |
          {
            echo "👀 cc @ashrafiucse — daily KEV triage ready ($NEW_COUNT new)."
            echo "(bot-created issues don't trigger workflows — this mention IS the notification)"
            echo
            echo "KEV entries added in the last 10 days, not yet triaged: $NEW_COUNT"
            echo
            echo '```'
            cat /tmp/new.txt
            echo '```'
            echo
            echo "Triage per MAINTENANCE.md: for entries affecting covered ecosystems, add"
            echo "\`skills/cve-research/vuln-db/entries/\` files (template: \`entry-template.md\`)."
            echo "Infra-only entries can be closed — live KEV lookups cover them at scan time."
          } > /tmp/issue-body.md
          gh label create kev 2>/dev/null || true
          gh label create triage 2>/dev/null || true
          gh issue create \
            --title "KEV update: $NEW_COUNT new exploited vulnerabilities to triage" \
            --body-file /tmp/issue-body.md \
            --label kev --label triage
