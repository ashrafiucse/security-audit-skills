name: Weekly Metasploit module watch (public exploit availability)

# Stateless: lists CVE-backed exploit modules ADDED to rapid7/metasploit-framework
# in the last 7 days (commits touching modules/exploits — plural, verified against
# the live tree; if the repo renames it again the guard fails LOUDLY so breakage
# is visible, not silent), deduped against vuln-db + open msf-labeled issues.
# Opens ONE digest issue. Public exploit availability turns "theoretical CVE"
# into a drop-in weapon — severity ammunition for entries and reports.
# Never commits.

on:
  schedule:
    - cron: "45 6 * * 1" # Mondays 06:45 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  msf-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find newly added CVE-backed exploit modules
        id: msf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # guard: fail loudly if the modules path was renamed again
          gh api "repos/rapid7/metasploit-framework/contents/modules/exploits" --jq 'length' >/dev/null
          gh api --paginate "repos/rapid7/metasploit-framework/commits?path=modules%2Fexploits&since=$SINCE&per_page=100" \
            --jq '.[].sha' > /tmp/shas.txt || true
          python3 - <<'EOF'
          import json, os, re, subprocess

          triaged = ""
          for name in os.listdir("skills/cve-research/vuln-db/entries"):
              triaged += open(os.path.join("skills/cve-research/vuln-db/entries", name),
                              encoding="utf-8", errors="replace").read()
          reported = ""
          try:
              reported = subprocess.run(
                  ["gh", "issue", "list", "--label", "msf", "--state", "open",
                   "--json", "body", "-L", "50"],
                  capture_output=True, text=True, check=True).stdout
          except subprocess.CalledProcessError:
              pass

          rx = re.compile(r"cve[_/](\d{4})[_/](\w+)")
          seen, lines = set(), []
          for sha in open("/tmp/shas.txt").read().split():
              try:
                  detail = subprocess.run(
                      ["gh", "api", f"repos/rapid7/metasploit-framework/commits/{sha}"],
                      capture_output=True, text=True, check=True, timeout=30).stdout
              except subprocess.CalledProcessError:
                  continue
              for f in json.loads(detail).get("files", []):
                  if f.get("status") not in ("added",) or not f["filename"].endswith(".rb"):
                      continue
                  m = rx.search(f["filename"].lower())
                  if not m:
                      continue
                  cve = f"CVE-{m.group(1)}-{m.group(2).lstrip('0') or '0'}"
                  if cve in seen or cve in triaged or cve in reported:
                      continue
                  seen.add(cve)
                  lines.append(f"{cve} | {f['filename'].split('/')[-1]}")

          open("/tmp/new.txt", "w").write("\n".join(sorted(lines)))
          open("/tmp/count.txt", "w").write(str(len(lines)))
          EOF
          echo "new=$(cat /tmp/count.txt)" >> "$GITHUB_OUTPUT"

      - name: Open digest issue for new exploit modules
        if: steps.msf.outputs.new != '' && steps.msf.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COUNT: ${{ steps.msf.outputs.new }}
        run: |
          {
            echo "👀 cc @ashrafiucse — weekly Metasploit digest ($NEW_COUNT new)."
            echo "(bot-created issues don't trigger workflows — this mention IS the notification)"
            echo
            echo "Newly added CVE-backed Metasploit exploit modules (public weaponization): $NEW_COUNT"
            echo
            echo '```'
            cat /tmp/new.txt
            echo '```'
            echo
            echo "Triage per MAINTENANCE.md: check each CVE against the vuln-db — if an entry"
            echo "exists, add 'public Metasploit module' to its Summary (severity ammunition);"
            echo "if not and it's repo-detectable, draft an entry. Product-only CVEs close as"
            echo "live-only; log the batch in kev-triage-log.md."
          } > /tmp/issue-body.md
          gh label create msf 2>/dev/null || true
          gh label create triage 2>/dev/null || true
          gh issue create \
            --title "Metasploit watch: $NEW_COUNT new exploit modules" \
            --body-file /tmp/issue-body.md \
            --label msf --label triage
